name: Publish to npm and JSR

# Additional convenience distribution to the npm registry and JSR.
# The CANONICAL release is the rngit release (signed tarballs over the mesh);
# this workflow merely mirrors the same tagged versions to npmjs.com and
# jsr.io so the broader JS ecosystem can install them. It runs only when a
# `v*` tag reaches the `github` remote.
on:
  push:
    tags:
      - "v*"
  # The mesh-to-GitHub mirror may create tag refs without a push event
  # (e.g. via the API when its git push path errors — see the
  # v2.0.0-alpha.4 release, where the tag existed on GitHub but no
  # workflow ran). The `create` event fires for those; the job guard
  # keeps non-tag branches out. `workflow_dispatch` is the manual
  # escape hatch: dispatch with `ref` set to the tag.
  create:
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC trusted publishing
  contents: read

# Never run two publishes for the same tag at once; never cancel one mid-flight.
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # `create` fires for branch creations too — only tag refs on the v*
    # vocabulary publish; the guard also keeps `workflow_dispatch` runs
    # pointed at a branch from publishing the wrong ref
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          # Writing registry-url makes setup-node author ~/.npmrc so npm
          # publish targets the right registry; auth comes from OIDC
          # trusted publishing (no NPM_TOKEN needed).
          registry-url: https://registry.npmjs.org

      # JSR publishing runs native `deno publish`, not `npx jsr` — the
      # standalone jsr CLI embeds an older deno that panics on some
      # declaration rewrites (see scripts/jsr-dryrun.sh). `deno publish`
      # detects the GitHub Actions environment and authenticates through
      # OIDC trusted publishing (the `id-token: write` permission above); no
      # JSR token is needed.
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: npm ci

      # Lockstep: the tag (minus the leading v) must equal the package versions.
      # Stops a stray/mistyped tag from publishing unintended versions.
      - name: Verify the tag matches the package version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          NOFLO=$(node -p "require('./packages/noflo/package.json').version")
          echo "Tag: $TAG   noflo version: $NOFLO"
          if [ "$TAG" != "$NOFLO" ]; then
            echo "::error::Tag 'v$TAG' does not match packages version '$NOFLO'"
            exit 1
          fi

      # lib/ is git-ignored/generated, not committed — build it for the
      # tarballs (this also runs the tests via the package's pretest hook).
      - name: Build and test
        run: npm test

      # Generated declarations (adjacent `.d.ts` files under each package's
      # `src/`) are git-ignored (build artifacts, never committed). JSR's
      # underlying `deno publish` honors `.gitignore`, so it would drop them —
      # un-ignore them here so the `jsr publish` steps below can ship them.
      # The per-package `.npmignore` files already cover npm pack, which only
      # falls back to `.gitignore` when no `.npmignore` is present. Affects
      # only the ephemeral CI checkout. See `scripts/jsr-dryrun.sh` for the
      # equivalent local helper.
      - name: Expose generated declarations to JSR
        run: |
          printf '\n!packages/*/src/**/*.d.ts\n!packages/assembly-utils/components/*.d.ts\n' >> .gitignore

      # Publish every package independently: one failing package must not
      # block the rest — the loop below continues past failures and only
      # fails the job for real publish errors. (The npm loop iterates
      # packages/*; order is irrelevant because npm resolves dep version
      # ranges at install time. The JSR loop uses a topological order via
      # scripts/jsr-publish-order.js, because JSR resolves its jsr:
      # dependencies at PUBLISH time.)
      - name: Publish all to NPM
        run: |
          set -uo pipefail
          real_failures=0
          for dir in packages/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            # Pre-release versions (2.0.0-alpha.N etc.) publish under the
            # `next` dist-tag so they never hijack `latest`; stable versions
            # keep the default tag. JSR has no dist-tag concept, so only the
            # npm step needs this.
            version=$(node -p "require('./$dir/package.json').version")
            case "$version" in
              *-*) dist_tag=(--tag next) ;;
              *) dist_tag=() ;;
            esac
            echo "::group::npm publish $name"
            # A package that does not exist on the registry yet cannot be
            # published via OIDC (no trusted publisher can be registered for
            # a package that has no first version) — that bootstrap is a
            # manual step, reported as a warning with the follow-up command,
            # not a job failure. A package that DOES exist but fails to
            # publish is a real error.
            if out=$(npm publish "$dir" --access public "${dist_tag[@]}" 2>&1); then
              echo "published $name"
            elif grep -q "previously published" <<<"$out"; then
              echo "$name already published — skipping"
            elif npm view "$name" version &>/dev/null; then
              echo "::error::$name exists on npm but failed to publish"
              printf '%s\n' "$out"
              real_failures=$((real_failures+1))
            else
              echo "::warning::$name is not on npm yet (new package, no trusted publisher for OIDC). Publish it manually once, then register the trusted publisher."
              {
                echo "### Manual follow-up"
                echo "- NPM: \`cd $dir && npm publish --access public\`, then register the GitHub Actions trusted publisher for it on npmjs.com"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          exit "$real_failures"

      # Independent of the npm step: a registry-publisher failure on one
      # side must not skip the other. The gates above (tag check, tests)
      # still gate both — `success() || failure()` runs this step when
      # prior steps passed or when only the npm step failed, and skips it
      # on cancellation.
      - name: Publish all to JSR
        if: success() || failure()
        run: |
          set -uo pipefail
          real_failures=0
          for dir in $(node scripts/jsr-publish-order.js); do
            name=$(node -p "require('./$dir/jsr.json').name")
            echo "::group::jsr publish $name"
            # --no-check mirrors scripts/jsr-dryrun.sh: full-check mode
            # produces phantom TS2305 errors for packages shipping adjacent
            # .d.ts files (deno 2.9.x); the slow-type public-API gate runs
            # regardless of this flag.
            if out=$(cd "$dir" && deno publish --allow-dirty --no-check 2>&1); then
              echo "published $name"
            elif grep -qi "already exists" <<<"$out"; then
              echo "$name already published — skipping"
            elif curl -fsS -o /dev/null "https://jsr.io/$name/meta.json"; then
              echo "::error::$name exists on JSR but failed to publish"
              printf '%s\n' "$out"
              real_failures=$((real_failures+1))
            else
              echo "::warning::$name is not on JSR yet (new package, no trusted publisher for OIDC). Publish it manually once, then register the trusted publisher."
              {
                echo "### Manual follow-up"
                echo "- JSR: \`cd $dir && deno publish\` (OIDC authenticates once the trusted publisher is registered on jsr.io)"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          exit "$real_failures"
