name: Run tests

on: [push, pull_request]

jobs:
  node:
    name: Test with Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check file formatting against EditorConfig
        uses: editorconfig-checker/action-editorconfig-checker@v3.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
  deno:
    name: Test with Deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 'v2.x'
          cache: true
      # The monorepo's own workspace packages publish alphas minutes
      # before CI runs; Deno's supply-chain age policy would block them.
      # Workspace deps are trusted by construction.
      - run: deno install --minimum-dependency-age=0
      - run: deno run test:deno
  bun:
    name: Test with Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run test:bun
  firefox:
    name: Test with Firefox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      # Real-browser verification for the no-build browser contract (work
      # document #18): the fixture page runs the static-registry NoFlo flow
      # as plain ES modules in a real browser. The launcher installs the
      # pinned Playwright and Firefox on demand (--ensure), so no browser
      # tooling is a devDependency.
      - run: npm run test:browser -- --ensure
